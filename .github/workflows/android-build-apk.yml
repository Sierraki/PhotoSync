name: Android Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Assemble Debug APK
        run: |
          gradle -p android :app:assembleDebug

      - name: Rename debug APK to PhotoSync.apk
        run: |
          set -e
          apk_dir="android/app/build/outputs/apk/debug"
          apk_path=$(ls -1 "$apk_dir"/*.apk | head -n 1)
          echo "Found APK: $apk_path"
          cp "$apk_path" "$apk_dir/PhotoSync.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/PhotoSync.apk
