name: Android Release (APK)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'App 版本号（例如：1.6）'
        required: true
        type: string
      versionCode:
        description: 'App 版本码（整数，必须递增，例如：8）'
        required: true
        type: number
      releaseNotes:
        description: 'Release 说明（可选）'
        required: false
        type: string
      draft:
        description: '是否创建为 Draft（建议 true，确认无误后再发布）'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show current version
        run: |
          python - << 'PY'
          import re
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          txt = p.read_text(encoding='utf-8')
          vc = re.search(r'versionCode\s*=\s*(\d+)', txt)
          vn = re.search(r'versionName\s*=\s*"([^"]+)"', txt)
          print('current versionCode =', vc.group(1) if vc else '?')
          print('current versionName =', vn.group(1) if vn else '?')
          PY

      - name: Bump version in build.gradle.kts
        run: |
          python - << 'PY'
          import re
          from pathlib import Path
          version_name = r'''${{ inputs.versionName }}'''.strip()
          version_code = int(r'''${{ inputs.versionCode }}''')

          p = Path('android/app/build.gradle.kts')
          txt = p.read_text(encoding='utf-8')

          txt2, n1 = re.subn(r'(versionCode\s*=\s*)\d+', r'\\g<1>%d' % version_code, txt)
          txt3, n2 = re.subn(r'(versionName\s*=\s*)"[^"]*"', r'\\g<1>"%s"' % version_name, txt2)

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'failed to update version fields: versionCode replacements={n1}, versionName replacements={n2}')

          p.write_text(txt3, encoding='utf-8')
          print('updated versionCode/versionName')
          PY

      - name: Assemble Release APK
        run: |
          gradle -p android :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.versionName }}
          name: v${{ inputs.versionName }}
          body: ${{ inputs.releaseNotes }}
          draft: ${{ inputs.draft }}
          files: |
            android/app/build/outputs/apk/release/*.apk
