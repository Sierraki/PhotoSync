name: Android Auto Release (APK)

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-auto-release.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish even if tag already exists (update existing Release assets)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version + prepare release metadata
        id: meta
        run: |
          python - << 'PY'
          import re
          from pathlib import Path

          gradle = Path('android/app/build.gradle.kts').read_text(encoding='utf-8')
          m_code = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          m_name = re.search(r'versionName\s*=\s*\"([^\"]+)\"', gradle)
          if not m_code or not m_name:
              raise SystemExit('Cannot find versionCode/versionName in android/app/build.gradle.kts')

          version_code = m_code.group(1)
          version_name = m_name.group(1)
          tag = f'v{version_name}'

          title_file = Path('android/release_title.txt')
          notes_file = Path('android/release_notes.md')

          title = title_file.read_text(encoding='utf-8').strip() if title_file.exists() else f'PhotoSync ver.{version_name}'
          notes = notes_file.read_text(encoding='utf-8') if notes_file.exists() else ''

          title = title.replace('{{VERSION_NAME}}', version_name).replace('{{VERSION_CODE}}', version_code)
          notes = notes.replace('{{VERSION_NAME}}', version_name).replace('{{VERSION_CODE}}', version_code)
          if not notes.strip():
              notes = f'PhotoSync ver.{version_name} (versionCode {version_code})'

          Path('release_body.md').write_text(notes.strip() + '\n', encoding='utf-8')

          with open('GITHUB_OUTPUT', 'a', encoding='utf-8') as f:
              f.write(f'version_name={version_name}\n')
              f.write(f'version_code={version_code}\n')
              f.write(f'tag={tag}\n')
              f.write(f'title={title}\n')
          print('versionName=', version_name)
          print('versionCode=', version_code)
          print('tag=', tag)
          print('title=', title)
          PY

      - name: Skip if tag already exists
        id: tagcheck
        run: |
          tag='${{ steps.meta.outputs.tag }}'
          force='${{ github.event.inputs.force_publish }}'
          if [ "$force" = "true" ]; then
            echo "force_publish=true; will publish/update Release for $tag"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag. Skip release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK 17
        if: steps.tagcheck.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        if: steps.tagcheck.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Verify signing secrets
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Missing secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "Missing secret: ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "Missing secret: ANDROID_KEY_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Missing secret: ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Decode keystore
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.keystore

      - name: Assemble Release APK
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          gradle -p android :app:assembleRelease
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/android/release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK to PhotoSync.apk
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          set -e
          apk_dir="android/app/build/outputs/apk/release"
          apk_path=$(ls -1 "$apk_dir"/*.apk | head -n 1)
          echo "Found APK: $apk_path"
          cp "$apk_path" "$apk_dir/PhotoSync.apk"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body_path: release_body.md
          draft: false
          files: |
            android/app/build/outputs/apk/release/PhotoSync.apk
